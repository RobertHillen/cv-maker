<form [formGroup]="avatarForm">
  <div class="w-full">
    <div class="grid grid-cols-1 gap-3 md:grid-cols-12">
      <div class="min-w-0 md:col-span-4">
        <p-fileupload #avatarUploader mode="basic" chooseLabel="Avatar" chooseIcon="fa-solid fa-image" accept="image/*" [multiple]="false" [auto]="false" [customUpload]="true" [chooseButtonProps]="{ size: 'small' }" (onSelect)="showPreview($event); avatarUploader.clear()">
          <ng-template #filelabel></ng-template>
        </p-fileupload>
      </div>
      <div class="min-w-0 md:col-span-4">
        @if (imageURL && imageURL !== '') {
          <div class="imagePreview">
            <img [src]="imageURL" [alt]="avatarForm.value.name" height="60px" decoding="async">
          </div>
        }
      </div>
    </div>
  </div>
</form>
